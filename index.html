<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directorio Anual 2009-2025</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
        }
        
        h1 {
            color: #333;
            font-size: 28px;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .user-name {
            color: #666;
            font-weight: 500;
        }
        
        .logout-btn {
            padding: 8px 16px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        .logout-btn:hover {
            background: #c0392b;
        }
        
        .directory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .year-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px 20px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .year-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }
        
        .year-card a {
            color: white;
            text-decoration: none;
            font-size: 24px;
            font-weight: 600;
            display: block;
        }
        
        .description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 5px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 32px;
            font-weight: 700;
            color: #667eea;
        }
        
        .stat-label {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Directorio Anual 2009-2025</h1>
            <div class="user-info">
                <span class="user-name">Usuario: <strong id="username"></strong></span>
                <button class="logout-btn" onclick="logout()">Cerrar Sesión</button>
            </div>
        </header>
        
        <div class="description">
            <strong>Bienvenido al Directorio Anual</strong><br>
            Este directorio contiene información organizada por años desde 2009 hasta 2025.
            Haga clic en cualquier año para acceder a su contenido.
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number">17</div>
                <div class="stat-label">Años Disponibles</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">2009</div>
                <div class="stat-label">Año Inicial</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">2025</div>
                <div class="stat-label">Año Final</div>
            </div>
        </div>
        
        <div class="directory-grid" id="directoryGrid">
            <!-- Los años se cargarán dinámicamente -->
        </div>
    </div>

    <script>
        // Verificar autenticación
        function checkAuth() {
            const loggedIn = sessionStorage.getItem('loggedIn');
            const username = sessionStorage.getItem('username');
            
            if (!loggedIn || loggedIn !== 'true') {
                window.location.href = 'login.html';
                return;
            }
            
            document.getElementById('username').textContent = username;
        }
        
        // Cerrar sesión
        function logout() {
            sessionStorage.clear();
            window.location.href = 'login.html';
        }
        
        // Generar directorio de años
        function generateYearDirectory() {
            const grid = document.getElementById('directoryGrid');
            const startYear = 2009;
            const endYear = 2025;
            
            for (let year = endYear; year >= startYear; year--) {
                const card = document.createElement('div');
                card.className = 'year-card';
                card.innerHTML = `<a href="years/${year}/index.html">${year}</a>`;
                grid.appendChild(card);
            }
        }
        
        // Inicializar
        checkAuth();
        generateYearDirectory();
    </script>
</body>
</html>
